# XcodeGen spec. Reel.xcodeproj is generated from this file - edit here, then
# run `xcodegen` (brew install xcodegen) rather than changing the project in Xcode.
name: Reel
options:
  bundleIdPrefix: me.eamonmurphy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ReelCore:
    path: Packages/ReelCore
  VLCKitSPM:
    url: https://github.com/tylerjonesio/vlckit-spm
    exactVersion: 3.6.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Set your team in Xcode (Signing & Capabilities); a free Apple ID works.
    DEVELOPMENT_TEAM: ""
targets:
  Reel:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: Reel
    dependencies:
      - package: ReelCore
        product: ReelCore
      - package: VLCKitSPM
        product: VLCKitSPM
    info:
      path: Reel/Info.plist
      properties:
        CFBundleDisplayName: Reel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Without this iOS silently blocks connections to the router.
        NSLocalNetworkUsageDescription: Reel connects to your SMB share to list and play your movies and TV shows.
        # Needed to list SMB servers the way the Files app does.
        NSBonjourServices:
          - _smb._tcp
        # Lets audio keep going for the second it takes to lock the phone and
        # plays through the silent switch.
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.eamonmurphy.reel
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
